id = "jinja2-embedded"
name = "Jinja2 Embedded (YAML/JSON)"
description = "Jinja2 highlighting for plain, YAML and JSON templates (.j2, .yaml.j2, .json.j2)"
version = "0.1.0"
schema_version = 1
authors = ["Sergey Galkin"]
repository = "https://github.com/sergeygalkin/zed-jinja2"

# Tree-sitter Jinja grammar
[grammars.jinja]
repository = "https://github.com/cathaysia/tree-sitter-jinja"
commit = "129184fb7bbc2d3e29967002432a869ac3758f2e"
path = "tree-sitter-jinja"

[jinja2-embedded]
submodule = "extensions/jinja2-embedded"
version = "0.1.0"
